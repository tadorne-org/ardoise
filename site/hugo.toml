baseURL = "https://ardoise.tadorne.org/"
title = "Ardoise"
enableRobotsTXT = true
enableEmoji = false
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
summaryLength = 25
timeZone = "Europe/Paris"

[params]
  parentName = "Tadorne"
  parentURL = "https://tadorne.org/"
  motto = "duck engineering"
  # Contact address shown on the site (footer and about pages).
  contact = "contact@tadorne.org"
  # Section holding dated notes, per language (paths differ EN/FR).
  logSection = "/log"
  gpgFingerprint = "5420 08E3 53EC A628 B4D6  ACAD 8C03 243A FF69 5BF7"
  gpgUid = "Tadorne <contact@tadorne.org>"
  gpgURL = "https://tadorne.org/verify/"
  # Social card. Raster, not SVG: X and most scrapers refuse SVG previews.
  ogImage = "/img/og-default.png"
  ogImageWidth = 1200
  ogImageHeight = 630
  ogImageAlt = "Ardoise — un instrument Tadorne — ardoise.tadorne.org"
  # Indexation open: no noindex meta, permissive robots.txt.
  seoIndexable = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[languages]

  [languages.en]
    locale = "en-GB"
    label = "English"
    direction = "ltr"
    contentDir = "content/en"
    weight = 1
    title = "Ardoise"
    [languages.en.params]
      description = "A mast-foot display for racing: the numbers that matter, large, readable from the cockpit in full sun, on a single NMEA 2000 drop cable. In development. A Tadorne instrument."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Instrument"
        pageRef = "/project"
        weight = 10
      [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about"
        weight = 50

  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    direction = "ltr"
    contentDir = "content/fr"
    weight = 2
    title = "Ardoise"
    [languages.fr.params]
      description = "Un afficheur de pied de mât pour la régate : les chiffres utiles, en gros, lisibles du cockpit en plein soleil, sur une seule dérivation NMEA 2000. En développement. Un instrument Tadorne."
      logSection = "/journal"
    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = "Instrument"
        pageRef = "/projet"
        weight = 10
      [[languages.fr.menus.main]]
        name = "À propos"
        pageRef = "/a-propos"
        weight = 50
